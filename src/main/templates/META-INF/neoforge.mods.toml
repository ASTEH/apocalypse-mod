# Aftermath mod metadata, generated from gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ASTEH/apocalypse-mod"
authors="ASTEH"
description='''A server-authoritative survival framework for a zombie-apocalypse modpack.
Adds character traits, weapon proficiency, learning systems and configurable zombie meta-events.
Requires no gameplay mods.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

