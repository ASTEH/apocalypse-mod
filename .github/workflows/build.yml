name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: bash ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: aftermath-1.21.1
          path: build/libs/aftermath-*.jar
          if-no-files-found: error
          retention-days: 7
